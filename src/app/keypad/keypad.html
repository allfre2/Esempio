<div class="keys">
    <key [value]="'1'" (pressed)="onKeyPressed($event)"></key>
    <key [value]="'2'" (pressed)="onKeyPressed($event)"></key>
    <key [value]="'3'" (pressed)="onKeyPressed($event)"></key>
    <key [value]="'4'" (pressed)="onKeyPressed($event)"></key>
    <key [value]="'5'" (pressed)="onKeyPressed($event)"></key>
    <key [value]="'6'" (pressed)="onKeyPressed($event)"></key>
    <key [value]="'7'" (pressed)="onKeyPressed($event)"></key>
    <key [value]="'8'" (pressed)="onKeyPressed($event)"></key>
    <key [value]="'9'" (pressed)="onKeyPressed($event)"></key>
    <key [value]="'*'" (pressed)="onKeyPressed($event)"></key>
    <key [value]="'0'" (pressed)="onKeyPressed($event)"></key>
    <key [value]="'#'" (pressed)="onKeyPressed($event)"></key>
    <button (click)="Call()" class="action call-btn"> &#128222; Join</button>
    <button (click)="Hangup()" class="action hangup-btn"> &#9742; Hangup</button>
</div>
